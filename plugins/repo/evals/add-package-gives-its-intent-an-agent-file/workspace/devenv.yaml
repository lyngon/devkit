# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
require_version: ">=2.4.0"

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  lyngon:
    url: github:lyngon/devkit
    flake: false

imports:
  - lyngon/devenv
  - ./libs/tides
