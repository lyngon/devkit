# The type check of the devkit's own Python programs. This repository is no
# Python project, so the file holds this table and nothing else.
[tool.basedpyright]
typeCheckingMode = "all"
# As target-version in ruff.toml: the oldest Python the programs must run on.
pythonVersion = "3.13"
# The first three repeat the defaults, which a list set here replaces. The
# eval cases seed their files into a run as the code of an imagined repository.
# tmp/ is the agent scratch directory, which git ignores and basedpyright,
# unlike ruff, would still read.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "plugins/*/evals", "tmp"]
# The baseline runs agent-identity.py with devenv/ on PYTHONPATH, for agent_token.py.
# The hooks of the build plugin and the script of its live-mutation skill import
# a module from their own directory, which Python puts first on the path of a script.
extraPaths = ["devenv", "plugins/build/hooks", "plugins/build/skills/live-mutation/scripts"]
