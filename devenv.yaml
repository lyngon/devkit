# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
require_version: ">=2.3.0"

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs

# The Lyngon baseline, consumed from this repository's own working tree.
# Other repositories import it as `lyngon/devenv` from the `lyngon` input.
imports:
  - ./devenv
